database = "~/.local/share/salt-tui/history.db"
default_target = "*"
default_saltenv = "base"
default_execution_context = "auto" # auto, master, local, or masterless
theme = "dark" # dark or light; Ctrl+Shift+L toggles for this session
confirm_changes = true
confirmation_mode = "always" # always, large-target, production-only, never
confirm_if_target_count = 20
production_envs = ["prod", "production"]
redaction_patterns = []
refresh_seconds = 30
history_limit = 10000
log_limit = 100000
event_retention = 100000
live_return_timeout_seconds = 300
master_config = "/etc/salt/master"
salt = "salt"
salt_call = "salt-call"
salt_run = "salt-run"
salt_key = "salt-key"
salt_cp = "salt-cp"
backend = "cli" # cli or python (requires Salt in this Python environment)
enable_plugins = true
detail_cache_ttl_seconds = 900
detail_cache_minions_per_kind = 1000
minion_preview_grains = ["id", "os", "osrelease", "kernelrelease", "fqdn", "ipv4"]
# Pillar values can contain credentials. They are disabled by default and are never cached.
enable_pillar_details = false
pillar_public_paths = []

[file_roots]
base = ["/srv/salt"]
prod = ["/srv/salt/prod"]

[targets.production_web]
expression = "G@roles:web and G@env:prod"
type = "compound"
