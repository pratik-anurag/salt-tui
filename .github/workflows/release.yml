name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to retry (for example, v0.1.4)"
        required: true
        type: string
  schedule:
    # Every Monday at 08:00 Asia/Kolkata; the script selects alternate weeks.
    - cron: "30 2 * * 1"

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release_meta.outputs.release }}
      tag: ${{ steps.release_meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prepare scheduled patch release
        id: prepare
        if: github.event_name == 'schedule'
        run: python scripts/prepare_scheduled_release.py
      - name: Set release tag
        id: release_meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          PREPARED_TAG: ${{ steps.prepare.outputs.tag }}
          PREPARED_RELEASE: ${{ steps.prepare.outputs.release }}
        run: |
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            echo "release=$PREPARED_RELEASE" >> "$GITHUB_OUTPUT"
            echo "tag=$PREPARED_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "tag=${REQUESTED_TAG:-$REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
      - name: Check tag and PyPI version
        if: steps.release_meta.outputs.release == 'true'
        env:
          GITHUB_REF_NAME: ${{ steps.release_meta.outputs.tag }}
        run: python scripts/check_release.py
      - name: Install development dependencies
        if: steps.release_meta.outputs.release == 'true'
        run: python -m pip install -e ".[dev]"
      - name: Test
        if: steps.release_meta.outputs.release == 'true'
        run: python -m pytest -q
      - name: Build
        if: steps.release_meta.outputs.release == 'true'
        run: python -m build
      - name: Validate distributions
        if: steps.release_meta.outputs.release == 'true'
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py
      - uses: actions/upload-artifact@v4
        if: steps.release_meta.outputs.release == 'true'
        with:
          name: python-distributions
          path: dist/
      - name: Commit and tag scheduled release
        if: github.event_name == 'schedule' && steps.release_meta.outputs.release == 'true'
        env:
          RELEASE_TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml CHANGELOG.md
          git commit -m "Release $RELEASE_TAG"
          git push origin HEAD:main
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

  publish:
    needs: build
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
