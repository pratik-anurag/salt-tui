name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Test
        run: python -m pytest -q
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate metadata and contents
        run: |
          python -m twine check dist/*
          python scripts/check_dist.py
      - name: Install wheel in a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/salt-tui-install"
          "$RUNNER_TEMP/salt-tui-install/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/salt-tui-install/bin/salt-tui" --version
          "$RUNNER_TEMP/salt-tui-install/bin/salt-tui" --help
          "$RUNNER_TEMP/salt-tui-install/bin/python" -m salt_tui --version
      - name: pipx smoke test
        run: |
          python -m pip install pipx
          export PIPX_HOME="$RUNNER_TEMP/pipx-home"
          export PIPX_BIN_DIR="$RUNNER_TEMP/pipx-bin"
          python -m pipx install dist/*.whl
          "$PIPX_BIN_DIR/salt-tui" --version
          python -m pipx uninstall salt-tui
      - name: Build Debian package
        run: |
          sudo apt-get update
          sudo apt-get install --yes debhelper dh-sequence-python3 pybuild-plugin-pyproject python3-all python3-hatchling
          dpkg-buildpackage --no-sign --build=binary
          dpkg-deb --info ../salt-tui_*.deb
