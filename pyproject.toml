[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "salt-tui"
version = "0.1.3"
description = "A keyboard-driven SaltStack operations console"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Systems Administration",
]
dependencies = ["textual>=7.5,<8", "rich>=13.7", "PyYAML>=6", "Pygments>=2.16"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.2", "twine>=6"]

[project.scripts]
salt-tui = "salt_tui.cli:main"

[project.urls]
Homepage = "https://github.com/pratik-anurag/salt-tui"
Repository = "https://github.com/pratik-anurag/salt-tui"
Issues = "https://github.com/pratik-anurag/salt-tui/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/salt_tui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
